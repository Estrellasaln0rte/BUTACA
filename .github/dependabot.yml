# Dependabot revisa una vez por semana si hay dependencias con actualizaciones o vulnerabilidades
# y abre un PR hacia dev para actualizarlas.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencias:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
